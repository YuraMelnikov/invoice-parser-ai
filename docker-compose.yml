name: operator

volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:
  pgadmin_storage:
  docs_ai:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.1.30/m/Приходные накладные/AI"
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,uid=1000,gid=1000,file_mode=0777,dir_mode=0777,iocharset=utf8,noperm"

networks:
  katek_lab:

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['katek_lab']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - NODE_FUNCTION_ALLOW_BUILTIN=fs,crypto   # Code-узлам: fs (шаг 6, архивирование), crypto (шаг 7, UUID для Qdrant)
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
  env_file:
    - path: .env
      required: true

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  networks: ['katek_lab']
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: ['katek_lab']
  container_name: ollama-pull-models
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  command: ["-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen3-vl:8b-instruct-q8_0 && ollama pull qwen3:8b && ollama pull bge-m3"]
  environment:
    - OLLAMA_HOST=ollama:11434

services:
  pdf-render:
    build: ./shared/pdf-render
    container_name: pdf-render
    networks: ['katek_lab']
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - docs_ai:/data/docs:ro
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request;urllib.request.urlopen(\"http://localhost:8000/health\")"']
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['katek_lab']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - 5432:5432   # доступ с хоста для отладки (psql/DBeaver)
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro   # автонакат схемы (шаг 1)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./shared:/data/shared
      - docs_ai:/data/docs
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks: ['katek_lab']
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    networks: ['katek_lab']
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@katek.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-pgadmin}
    ports:
      - 8080:80
    volumes:
      - pgadmin_storage:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-llama-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-llama-gpu-amd:
    profiles: [gpu-amd]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
     - ollama-gpu-amd